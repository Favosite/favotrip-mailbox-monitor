name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:cov
      - name: Verify no SMTP / mail-send dependency
        run: |
          set -e
          if grep -REq "(nodemailer|@aws-sdk/client-ses|smtp|sendmail)" package.json package-lock.json; then
            echo "::error::Outbound-mail dependency detected. This monitor must be observe-only — no SMTP, no SES."
            exit 1
          fi
          echo "no outbound-mail deps — ok"
