name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:cov
      - name: Verify no top-level SMTP / mail-send dependency
        run: |
          set -e
          # Only check TOP-LEVEL deps (dependencies + devDependencies in package.json).
          # Transitive deps like `nodemailer` brought in by `mailparser` for parsing
          # helpers are fine — we never instantiate a transport. The original grep
          # over package-lock.json caught those false positives.
          node -e "
            const pkg = require('./package.json');
            const top = Object.keys({...(pkg.dependencies||{}), ...(pkg.devDependencies||{})});
            const banned = /^(nodemailer|@aws-sdk\\/client-ses|smtp|sendmail)\$/i;
            const bad = top.filter(d => banned.test(d));
            if (bad.length) {
              console.error('::error::Top-level outbound-mail dep detected: ' + bad.join(', '));
              process.exit(1);
            }
            console.log('no top-level outbound-mail deps — ok');
          "
