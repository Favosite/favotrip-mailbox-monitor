# Local-dev compose file. Production compose lives in ~/favotrip/docker-compose.yml on EC2.
services:
  mailbox-monitor:
    build: .
    image: favotrip-mailbox-monitor:dev
    restart: unless-stopped
    environment:
      IMAP_USERNAME: klantenservice@favotrip.nl
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECRET_ID: favotrip/mailbox-monitor/imap
      AWS_REGION: eu-west-1
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: "#team"
      CRON_SCHEDULE: "*/5 * * * *"
      STATE_FILE: /var/lib/mailbox-monitor/state.json
      HASH_STORE_FILE: /var/lib/mailbox-monitor/sender-hashes.json
      HASH_SALT: ${HASH_SALT}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: info
      # Phase-3 keyword classifier (Dennis 2026-05-21). Leave unset to
      # disable keyword alerts; the digest behaviour is unchanged. In
      # prod the .env.mailbox-monitor file holds this value (see
      # ~/favotrip/.env.mailbox-monitor on prod-EC2).
      SLACK_CHANNEL_ALERTS: ${SLACK_CHANNEL_ALERTS:-}
      KEYWORD_DEDUPE_FILE: /var/lib/mailbox-monitor/keyword-dedupe.json
      # C13-B11-1 (fix-campagne wave 8): external liveness signal.
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      HEALTH_STALE_AFTER_MIN: ${HEALTH_STALE_AFTER_MIN:-10}
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    volumes:
      - mailbox-state:/var/lib/mailbox-monitor

volumes:
  mailbox-state:
